name: Build AutoSell

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies

      - name: Verify JAR output
        shell: bash
        run: |
          echo "Build output:"
          ls -lah build/libs/
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          if [ -z "$jar_file" ]; then
            echo "ERROR: No production JAR was produced."
            exit 1
          fi
          echo "Production JAR: $jar_file"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoSell-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
